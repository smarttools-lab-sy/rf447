name: Monitor RF447 import freshness
on:
  schedule:
    # Korea time: 09:30, 13:30, 19:30
    - cron: '30 0,4,10 * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify today's successful import
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.request
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(datetime.timezone.utc)
          kst = ZoneInfo("Asia/Seoul")
          local = now.astimezone(kst)
          cutoff = local.replace(hour=8, minute=0, second=0, microsecond=0).astimezone(datetime.timezone.utc)
          repo = os.environ["GH_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/import-aqara-cases.yml/runs?per_page=50"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          def when(run):
              return datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          recent = [r for r in runs if when(r) >= cutoff and r.get("event") in ("schedule", "workflow_dispatch")]
          successes = [r for r in recent if r.get("conclusion") == "success"]
          print(f"KST check: {local.isoformat(timespec='minutes')}; import runs since 08:00 KST: {len(recent)}; successes: {len(successes)}")
          if not successes:
              print("::error::No successful RF447 import workflow run since 08:00 KST. Check scheduled runs, API connectivity and import logs.")
              raise SystemExit(1)
          latest = max(successes, key=when)
          print(f"Last successful import: {latest['created_at']} UTC; run: {latest['html_url']}")
          PY
