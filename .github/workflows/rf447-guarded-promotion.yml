name: RF447 guarded production DB promotion
on:
  push:
    branches: [main]
    paths:
      - data.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rf447-production-db-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate database
        run: node scripts/validate-db.cjs
      - name: Test all candidate Worker verdict rules
        run: node scripts/test-worker-verdict.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Compare candidate web and Worker verdicts
        run: node scripts/verify-candidate-parity.cjs
      - name: Verify existing production snapshot
        run: |
          test -s published/data.json
          node -e "const d=require('./published/data.json');if(!Array.isArray(d.records)||!d.records.length)process.exit(1)"
      - name: Promote only validated candidate
        run: |
          set -euo pipefail
          cp data.json published/data.json
          if git diff --quiet -- published/data.json; then
            echo "Production snapshot already matches candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/data.json
          git commit -m "Promote validated RF447 database snapshot"
          git push origin HEAD:main
