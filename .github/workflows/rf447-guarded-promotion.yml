name: RF447 candidate DB preflight (safe dry run)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate database
        run: node scripts/validate-db.cjs
      - name: Confirm production snapshot exists
        run: |
          test -s published/data.json
          node -e "const d=require('./published/data.json');if(!Array.isArray(d.records)||!d.records.length)process.exit(1)"
      - name: Compare candidate and published snapshots (report only)
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const candidate=JSON.parse(fs.readFileSync('data.json','utf8'));
          const published=JSON.parse(fs.readFileSync('published/data.json','utf8'));
          console.log(JSON.stringify({candidateModels:candidate.records.length,publishedModels:published.records.length,candidateCases:(candidate.fieldCases||[]).length,publishedCases:(published.fieldCases||[]).length,identical:JSON.stringify(candidate)===JSON.stringify(published)},null,2));
          NODE
      - name: Safety gate
        run: echo "DRY RUN ONLY - production snapshot is not modified. Worker candidate parity required before enabling promotion."
