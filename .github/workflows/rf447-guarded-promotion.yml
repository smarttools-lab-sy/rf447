name: RF447 guarded DB promotion (manual pilot)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rf447-production-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate DB
        run: node scripts/validate-db.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Wait for API cache
        run: sleep 330
      - name: Require candidate web/API verdict parity
        env:
          RF447_API_KEY: ${{ secrets.RF447_API_KEY }}
        run: node scripts/verify-parity.cjs
      - name: Promote verified DB snapshot
        run: |
          mkdir -p published
          cp data.json published/data.json
          if git diff --quiet -- published/data.json; then
            echo "Production snapshot is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/data.json
          git commit -m "Promote verified RF447 production DB"
          git push
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf447-guarded-promotion-report
          path: test-results/
          if-no-files-found: ignore
